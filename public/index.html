    <script>
      // The Concall Deep Dive dashboard — a SEPARATE deployment that runs its own LLM pipeline
      // over a company's call. The Con-call tab's Deep Dive column talks to it.
      //
      // Set here rather than left to each reader's browser because that Worker has no custom
      // domain, so the address is not something anyone can guess. Reading its report index and
      // any finished report is free; STARTING a run costs real compute on their side, which is
      // why nothing in this app dispatches one without an explicit click and a confirm step.
      // `localStorage['sattva:deepdive-base']` overrides this, which is how verify-ui.mjs points
      // a whole verification run at a stub.
      //
      // IN ITS OWN BLOCK, BEFORE THE CDN. It first shared the Tailwind config script below, and
      // when the CDN was unreachable `tailwind.config = …` threw on the line above it — so this
      // assignment never ran and the column silently fell back to asking for a URL. An unrelated
      // network failure must not be able to unwire a feature.
      //
      // That endpoint is unauthenticated, so this line makes it reachable by anyone who loads the
      // page. Putting auth on `POST /api/analyze` belongs on that Worker — see docs/HANDOFF.md §9.
      window.SATTVA_DEEPDIVE_URL = 'https://concall-sattva.tech-441.workers.dev';

      // The retail-chatter API, read by the Public Chatter tab. ALSO CALLED FROM THE BROWSER, and
      // for a harder reason than the one above: it is another Worker on this same Cloudflare
      // account, and Cloudflare REFUSES a Worker-to-Worker subrequest inside one zone (error 1042,
      // surfaced as a 404). A `/api/chatter` proxy was written and deployed and failed exactly that
      // way, while curl got 200 from the identical URL. See js/data/chatter-live.js.
      //
      // Safe to publish: the endpoint is public, unauthenticated, read-only and CORS-open, so there
      // is no credential here to leak and nothing a reader can spend.
      // `localStorage['sattva:chatter-base']` overrides it, which is how verify-ui.mjs points the
      // feed at a stub.
      window.SATTVA_CHATTER_URL = 'https://sentimentdash-api.tech-441.workers.dev/v1';
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind CDN config — no build step, no bundler (see CLAUDE.md).
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <style>
      /* ---- Design tokens. Keep every colour decision traceable to one of these. ----
         Brand ramp is indigo → purple → pink. Emerald/amber/rose are reserved strictly
         for semantic rule states (pass / partial / fail) and must never be used as brand. */
      :root {
        --brand-500: #6366f1; /* indigo — brand ramp start */
        --brand-600: #4f46e5; /* indigo-600 — links, actions, active nav */
        --brand-mid: #a855f7; /* purple — brand ramp middle */
        --brand-end: #ec4899; /* pink — brand ramp end */
        --accent-600: #4f46e5; /* indigo-600 — accent for links/actions */

        /* Semantic states — rule outcomes only, never brand. */
        --positive: #059669; /* emerald — pass */
        --caution: #d97706; /* amber — partial */
        --negative: #e11d48; /* rose — fail */
        --hard-fail: #be123c; /* rose-700 — hard fail */
        --neutral: #64748b; /* slate — n/a */

        --page-bg: #f8fafc;
        --surface: #ffffff;
        --ink-900: #0f172a;
        --ink-600: #475569;
        --ink-400: #94a3b8;
        --radius-surface: 1rem;
      }

      html {
        scroll-behavior: smooth;
        /* The closed drill panel is position:fixed and parked at translateX(100%), i.e. just
           off the right edge. `overflow-x` on <body> does not clip fixed elements, so without
           this the parked panel widens the document and the page scrolls sideways. */
        overflow-x: hidden;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink-900);
        background:
          radial-gradient(at 0% 0%, rgba(167, 139, 250, 0.12) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(244, 114, 182, 0.1) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
          #f8fafc;
        min-height: 100vh;
        /* The page body must never scroll sideways — wide tables scroll inside their own
           overflow-x container instead (see scoreTable in ui/screener.js). */
        overflow-x: hidden;
      }

      .font-display {
        font-family: 'Plus Jakarta Sans', 'Inter', ui-sans-serif, sans-serif;
      }

      /* Tabular numerals — every number-bearing cell uses fixed-width digits so columns line up. */
      table tbody td,
      table thead th,
      .stat-card,
      [data-numeric] {
        font-variant-numeric: tabular-nums;
      }
      .tabular-nums,
      [class*='tabular-nums'] {
        font-variant-numeric: tabular-nums;
      }

      /* Slim scrollbars for table bodies, drill panels and dropdowns. */
      .scrollbar-thin::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fade-in 0.4s ease-out both;
      }

      /* Header refresh button, while it is checking the feeds. */
      @keyframes spin-slow {
        to {
          transform: rotate(360deg);
        }
      }
      .spin-slow {
        animation: spin-slow 0.9s linear infinite;
        transform-origin: center;
      }

      /* Top-tab nav — springy indigo→purple underline that scales in on the active tab. */
      .tab-btn {
        position: relative;
      }
      .tab-btn::after {
        content: '';
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: -1px;
        height: 3px;
        border-radius: 3px 3px 0 0;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .tab-btn.is-active::after {
        transform: scaleX(1);
      }
      .tab-btn.is-active {
        background: linear-gradient(180deg, transparent 60%, rgba(99, 102, 241, 0.05) 100%);
      }

      /* scoreTable row numbers come from a CSS counter, not from the markup — that keeps each
         row's HTML position-independent so sorting can reorder cached strings instead of
         regenerating 500+ rows. */
      tbody {
        counter-reset: sattva-row;
      }
      tbody tr.row-line {
        counter-increment: sattva-row;
      }
      .row-rank::before {
        content: counter(sattva-row);
      }

      /* Drill-panel provenance chips use <details>; hide the default disclosure triangle
         so the summary renders as a clean chip. */
      .meta-details > summary::-webkit-details-marker { display: none; }
      .meta-details > summary { list-style: none; }
      .meta-details > summary::marker { content: ''; }

      /* Right-slide drill panel + centred modal transitions (ui/screener.js). */
      .drill-panel {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #modal-overlay.is-open {
        display: flex;
      }
      #modal-overlay.is-open #modal-container {
        opacity: 1;
        transform: scale(1);
      }

      /* Full-screen workspace overlay (ui/screener.js openWorkspace) — the Con-call Deep Dive
         lives here. Bigger than the drill panel because it carries its own tab strip. */
      #workspace-overlay.is-open {
        display: flex;
      }
      #workspace-overlay.is-open #workspace-container {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      /* Set on <body> while a workspace is open so the page behind cannot scroll. */
      body.workspace-open {
        overflow: hidden;
      }

      /* Shimmer used by the skeleton primitive. */
      .skeleton-shimmer {
        position: relative;
        overflow: hidden;
      }
      .skeleton-shimmer::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0) 100%);
        animation: shimmer 1.6s infinite;
      }
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      /* Restrained scrollbars inside table containers and dropdowns. */
      ::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }

      /* Ask Research — a fixed-height analytical workspace under the dashboard chrome. */
      .research-workspace {
        display: flex;
        height: clamp(38rem, calc(100vh - 15.25rem), 56rem);
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.93);
        box-shadow: 0 20px 55px -35px rgba(79, 70, 229, 0.45), 0 1px 3px rgba(15, 23, 42, 0.05);
        backdrop-filter: blur(18px);
      }
      .research-workspace-header {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid #e2e8f0;
        padding: 1rem 1.25rem;
        background: linear-gradient(100deg, rgba(238, 242, 255, 0.78), rgba(250, 245, 255, 0.62) 52%, rgba(253, 242, 248, 0.55));
      }
      .research-spark {
        display: inline-flex;
        height: 2.25rem;
        width: 2.25rem;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border-radius: 0.8rem;
        color: white;
        background: linear-gradient(135deg, var(--brand-500), var(--brand-mid) 60%, var(--brand-end));
        box-shadow: 0 8px 20px -10px rgba(99, 102, 241, 0.8);
      }
      .research-spark svg { width: 1.2rem; height: 1.2rem; }
      .research-estate-chip {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 0.45rem;
        border: 1px solid rgba(199, 210, 254, 0.85);
        border-radius: 9999px;
        padding: 0.4rem 0.7rem;
        background: rgba(255, 255, 255, 0.78);
        color: #4f46e5;
        font-size: 0.6875rem;
        font-weight: 700;
      }
      .research-layout {
        display: grid;
        min-height: 0;
        flex: 1 1 auto;
        grid-template-columns: 16rem minmax(0, 1fr);
      }
      .research-sidebar {
        display: flex;
        min-height: 0;
        flex-direction: column;
        border-right: 1px solid #e2e8f0;
        background: rgba(248, 250, 252, 0.76);
      }
      .research-new-button {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        border-radius: 0.65rem;
        padding: 0.45rem 0.65rem;

      }

      .research-session-list {

        flex: 1 1 auto;
        overflow-y: auto;
        padding: 0.55rem;
      }

      }
      .research-session:hover { background: rgba(255, 255, 255, 0.78); color: #1e293b; }
      .research-session.is-active {
        border-color: rgba(199, 210, 254, 0.8);
        background: linear-gradient(100deg, rgba(238, 242, 255, 0.95), rgba(250, 245, 255, 0.72));

      .research-session-delete:hover { background: #fff1f2; color: #e11d48; }

      .research-session-delete svg { width: 0.9rem; height: 0.9rem; }
      .research-thread { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: rgba(255, 255, 255, 0.66); }
      .research-transcript { min-height: 0; flex: 1 1 auto; overflow-y: auto; overflow-anchor: none; padding: 1.5rem clamp(1rem, 3vw, 2.5rem); }
      .research-opening { max-width: 54rem; margin: 0 auto; padding: clamp(1rem, 4vh, 3.25rem) 0 2rem; text-align: center; }
      .research-opening-icon {
        display: inline-flex;
        height: 3.4rem;
        width: 3.4rem;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(199, 210, 254, 0.8);
        border-radius: 1.1rem;
        color: #6366f1;
        background: linear-gradient(135deg, #eef2ff, #faf5ff 55%, #fdf2f8);
        box-shadow: 0 14px 30px -20px rgba(99, 102, 241, 0.8);
      }
      .research-opening-icon svg { width: 1.6rem; height: 1.6rem; }
      .research-opening-promises { display: grid; margin-top: 1.35rem; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.55rem; text-align: left; }
      .research-promise { display: flex; align-items: flex-start; gap: 0.5rem; border: 1px solid #f1f5f9; border-radius: 0.75rem; padding: 0.65rem; background: rgba(248, 250, 252, 0.72); }
      .research-promise-dot { width: 0.42rem; height: 0.42rem; flex: 0 0 auto; margin-top: 0.25rem; border-radius: 9999px; background: linear-gradient(135deg, var(--brand-500), var(--brand-mid)); }
      .research-suggestions { display: grid; margin-top: 0.6rem; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem; text-align: left; }
      .research-suggestion { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 0.8rem; border: 1px solid #e2e8f0; border-radius: 0.85rem; padding: 0.75rem 0.85rem; background: white; color: #475569; font-size: 0.75rem; font-weight: 600; line-height: 1.1rem; transition: 150ms ease; }
      .research-suggestion:hover { border-color: #c7d2fe; color: #4338ca; box-shadow: 0 7px 20px -16px rgba(79, 70, 229, 0.9); transform: translateY(-1px); }
      .research-suggestion svg { width: 0.9rem; height: 0.9rem; flex: 0 0 auto; color: #a5b4fc; }
      .research-message-stack { width: min(100%, 58rem); margin: 0 auto; }
      .research-user-row { display: flex; justify-content: flex-end; margin: 0 0 1.25rem; }
      .research-user-bubble { max-width: min(75%, 38rem); border-radius: 1rem 1rem 0.3rem 1rem; padding: 0.7rem 0.95rem; background: linear-gradient(115deg, #4f46e5, #7c3aed); color: white; font-size: 0.8125rem; line-height: 1.35rem; box-shadow: 0 10px 25px -18px rgba(79, 70, 229, 0.9); white-space: pre-wrap; }
      .research-assistant-answer { margin: 0 0 1.75rem; padding-left: 1rem; border-left: 2px solid rgba(99, 102, 241, 0.35); }
      .research-assistant-answer.is-streaming { border-left-color: rgba(168, 85, 247, 0.42); }
      .research-answer-label { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.6rem; color: #6366f1; font-size: 0.625rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
      .research-mini-spark { font-size: 0.75rem; }
      .research-live-dot { width: 0.4rem; height: 0.4rem; border-radius: 9999px; background: #a855f7; box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1); animation: research-pulse 1.4s ease-in-out infinite; }
      @keyframes research-pulse { 50% { opacity: 0.38; transform: scale(0.72); } }
      .research-answer-body { max-width: 50rem; color: #334155; font-size: 0.8125rem; line-height: 1.45rem; }
      .research-answer-paragraph { margin-top: 0.65rem; }
      .research-answer-paragraph:first-child { margin-top: 0; border-radius: 0 0.65rem 0.65rem 0; background: linear-gradient(90deg, rgba(238, 242, 255, 0.75), transparent 86%); padding: 0.55rem 0.75rem; color: #1e293b; }
      .research-answer-heading { margin-top: 1.15rem; color: #0f172a; font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 0.875rem; font-weight: 800; }
      .research-answer-callout { margin-top: 0.85rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; background: #f8fafc; padding: 0.7rem 0.85rem; color: #475569; }
      .research-answer-list { margin-top: 0.7rem; padding-left: 1.2rem; }

      .research-thinking { display: flex; align-items: center; gap: 0.25rem; color: #64748b; font-size: 0.75rem; }
      .research-thinking > span { width: 0.3rem; height: 0.3rem; border-radius: 9999px; background: #a5b4fc; animation: research-bounce 1s ease-in-out infinite; }
      .research-thinking > span:nth-child(2) { animation-delay: 120ms; }
      .research-thinking > span:nth-child(3) { animation-delay: 240ms; margin-right: 0.35rem; }
      @keyframes research-bounce { 50% { transform: translateY(-3px); opacity: 0.45; } }
      .research-sources { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin-top: 0.85rem; }
      .research-source-chip { display: inline-flex; max-width: 13rem; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid #e2e8f0; border-radius: 9999px; padding: 0.25rem 0.5rem; background: #f8fafc; color: #64748b; font-size: 0.625rem; font-weight: 700; transition: 150ms ease; }
      .research-source-chip:hover { border-color: #c7d2fe; background: #eef2ff; color: #4f46e5; }
      .research-source-chip-web { border-color: #e9d5ff; background: #faf5ff; color: #7e22ce; }
      .research-composer-wrap { flex: 0 0 auto; border-top: 1px solid #e2e8f0; padding: 0.7rem clamp(1rem, 3vw, 2.5rem) 0.65rem; background: rgba(255, 255, 255, 0.9); }
      .research-config-notice { width: min(100%, 58rem); margin: 0 auto 0.45rem; border: 1px solid #fde68a; border-radius: 0.65rem; padding: 0.45rem 0.65rem; background: #fffbeb; color: #92400e; font-size: 0.6875rem; }
      .research-phase { width: min(100%, 58rem); margin: 0 auto 0.2rem; color: #64748b; font-size: 0.625rem; font-weight: 600; }
      .research-composer { width: min(100%, 58rem); margin: 0 auto; border: 1px solid #cbd5e1; border-radius: 1rem; background: white; box-shadow: 0 12px 35px -28px rgba(15, 23, 42, 0.45); transition: 150ms ease; }

      .research-composer textarea { display: block; width: 100%; resize: none; overflow-y: auto; border: 0; border-radius: 1rem 1rem 0 0; padding: 0.75rem 0.9rem 0.35rem; background: transparent; color: #1e293b; font-size: 0.8125rem; line-height: 1.35rem; outline: none; }
      .research-composer textarea::placeholder { color: #94a3b8; }
      .research-composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.35rem 0.45rem 0.45rem 0.55rem; }
      .research-web-button { display: inline-flex; min-width: 0; align-items: center; gap: 0.5rem; border-radius: 0.7rem; padding: 0.3rem 0.45rem; color: #64748b; text-align: left; transition: 150ms ease; }
      .research-web-button:hover:not(:disabled) { background: #f8fafc; color: #4f46e5; }
      .research-web-button.is-active { background: linear-gradient(100deg, #eef2ff, #faf5ff); color: #4f46e5; }
      .research-web-button svg { width: 1rem; height: 1rem; flex: 0 0 auto; }
      .research-web-button span { min-width: 0; }
      .research-web-button strong { display: block; font-size: 0.6875rem; line-height: 0.9rem; }
      .research-web-button small { display: block; margin-top: 0.05rem; color: #94a3b8; font-size: 0.5625rem; line-height: 0.75rem; }
      .research-send-button { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 0.4rem; border-radius: 0.7rem; padding: 0.5rem 0.75rem; color: white; background: linear-gradient(110deg, var(--brand-600), var(--brand-mid)); font-size: 0.6875rem; font-weight: 800; box-shadow: 0 7px 18px -12px rgba(79, 70, 229, 0.95); transition: 150ms ease; }
      .research-send-button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 9px 21px -12px rgba(79, 70, 229, 1); }
      .research-send-button:disabled { cursor: not-allowed; opacity: 0.38; box-shadow: none; }
      .research-send-button svg { width: 0.9rem; height: 0.9rem; }
      .research-new-button:focus-visible,
      .research-session > button:first-child:focus-visible,
      .research-session-delete:focus-visible,
      .research-suggestion:focus-visible,
      .research-web-button:focus-visible,
      .research-send-button:focus-visible,
      .research-source-chip:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }

      @media (max-width: 820px) {
        .research-workspace { height: auto; min-height: 44rem; }
        .research-workspace-header { align-items: flex-start; }
        .research-layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: 11rem minmax(34rem, 65vh); }
        .research-sidebar { border-right: 0; border-bottom: 1px solid #e2e8f0; }
        .research-session-list { display: flex; gap: 0.4rem; overflow-x: auto; overflow-y: hidden; }
        .research-session { width: 12rem; flex: 0 0 auto; }
        .research-sidebar > :last-child { display: none; }
        .research-opening { padding-top: 1.25rem; }
      }

      @media (max-width: 560px) {
        .research-workspace-header { padding: 0.85rem; }
        .research-estate-chip { display: none; }
        .research-layout { grid-template-rows: 10rem minmax(35rem, 68vh); }
        .research-transcript { padding: 1rem 0.8rem; }
        .research-opening-promises { grid-template-columns: minmax(0, 1fr); }
        .research-suggestions { grid-template-columns: minmax(0, 1fr); }
        .research-user-bubble { max-width: 88%; }
        .research-assistant-answer { padding-left: 0.7rem; }
        .research-composer-wrap { padding: 0.6rem 0.7rem; }
        .research-web-button small { display: none; }
        .research-send-button span { display: none; }
        .research-send-button { padding: 0.55rem 0.65rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body class="text-slate-800">
    <div id="app">
      <!-- Shell (header, rail, tabs, content host) is mounted by js/ui/shell.js. -->
      <div class="mx-auto max-w-lg px-6 py-24 text-center text-sm text-slate-400">Loading Sattva Central Research…</div>
    </div>

    <!-- Overlay layer, owned by ui/screener.js. Both are singletons: any tab can open the
         right-slide drill panel or the centred modal without mounting its own copy. -->
    <div id="drill-overlay" class="fixed inset-0 z-40 hidden bg-slate-900/30 backdrop-blur-sm"></div>
    <aside
      id="drill-panel"
      class="drill-panel scrollbar-thin fixed right-0 top-0 z-50 h-full w-full translate-x-full overflow-y-auto bg-white shadow-2xl sm:w-[480px]"
    >
      <div id="drill-content"></div>
    </aside>

    <div
      id="modal-overlay"
      class="fixed inset-0 z-[60] hidden items-center justify-center overflow-y-auto bg-slate-900/60 p-4 backdrop-blur-sm sm:p-8"
    >
      <div id="modal-container" class="relative my-8 w-full max-w-4xl scale-95 overflow-hidden rounded-3xl bg-white opacity-0 shadow-2xl transition-all duration-200">
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- Full-screen workspace overlay, owned by ui/screener.js.
         Stacking order is deliberate: drill (z-50) < workspace (z-55) < modal (z-60), so the
         keyword editor — a modal opened from inside the Deep Dive — lands on top of it rather
         than behind it. -->
    <div
      id="workspace-overlay"
      class="fixed inset-0 z-[55] hidden items-start justify-center overflow-y-auto bg-slate-900/70 p-0 backdrop-blur-sm sm:p-6"
    >
      <div
        id="workspace-container"
        class="relative w-full max-w-[1200px] translate-y-4 scale-[0.98] overflow-hidden rounded-none bg-white opacity-0 shadow-2xl transition-all duration-200 sm:my-4 sm:rounded-3xl"
      >
        <div id="workspace-content"></div>
      </div>
    </div>

    <!-- Live alert stack, owned by ui/notifications.js, which creates this node if it is absent.
         z-30 is deliberate and sits BELOW every overlay above: a toast announcing a result must
         never land on top of a drill panel or a workspace the reader opened on purpose. -->
    <div
      id="notification-root"
      role="status"
      aria-live="polite"
      class="pointer-events-none fixed bottom-4 right-4 z-30 flex w-[min(22rem,calc(100vw-2rem))] flex-col-reverse gap-2"
    ></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
