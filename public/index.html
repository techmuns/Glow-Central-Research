<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glow Central Research</title>
    <meta name="description" content="Glow Central Research — an Indian equities research and portfolio analytics dashboard." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23d9c48f'/%3E%3Cstop offset='50%25' stop-color='%23c3a962'/%3E%3Cstop offset='100%25' stop-color='%23b8923c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='800' fill='%231a1830' text-anchor='middle'%3ESC%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      rel="stylesheet"
    />

    <script>
      // The Concall Deep Dive dashboard — a SEPARATE deployment that runs its own LLM pipeline
      // over a company's call. The Con-call tab's Deep Dive column talks to it.
      //
      // Set here rather than left to each reader's browser because that Worker has no custom
      // domain, so the address is not something anyone can guess. Reading its report index and
      // any finished report is free; STARTING a run costs real compute on their side, which is
      // why nothing in this app dispatches one without an explicit click and a confirm step.
      // `localStorage['sattva:deepdive-base']` overrides this, which is how verify-ui.mjs points
      // a whole verification run at a stub.
      //
      // IN ITS OWN BLOCK, BEFORE THE CDN. It first shared the Tailwind config script below, and
      // when the CDN was unreachable `tailwind.config = …` threw on the line above it — so this
      // assignment never ran and the column silently fell back to asking for a URL. An unrelated
      // network failure must not be able to unwire a feature.
      //
      // That endpoint is unauthenticated, so this line makes it reachable by anyone who loads the
      // page. Putting auth on `POST /api/analyze` belongs on that Worker — see docs/HANDOFF.md §9.
      window.SATTVA_DEEPDIVE_URL = 'https://concall-sattva.tech-441.workers.dev';

      // The retail-chatter API, read by the Public Chatter tab. ALSO CALLED FROM THE BROWSER, and
      // for a harder reason than the one above: it is another Worker on this same Cloudflare
      // account, and Cloudflare REFUSES a Worker-to-Worker subrequest inside one zone (error 1042,
      // surfaced as a 404). A `/api/chatter` proxy was written and deployed and failed exactly that
      // way, while curl got 200 from the identical URL. See js/data/chatter-live.js.
      //
      // Safe to publish: the endpoint is public, unauthenticated, read-only and CORS-open, so there
      // is no credential here to leak and nothing a reader can spend.
      // `localStorage['sattva:chatter-base']` overrides it, which is how verify-ui.mjs points the
      // feed at a stub.
      window.SATTVA_CHATTER_URL = 'https://sentimentdash-api.tech-441.workers.dev/v1';

      // The AmfiBeas "Returns & Ranking" API, read by the Institutions (Fund Returns) sub-view. Like
      // the chatter feed above it is CORS-open, read-only and called STRAIGHT FROM THE BROWSER, so
      // there is no credential to hold and nothing to proxy for.
      //
      // LEFT EMPTY DELIBERATELY: the API is not yet deployed to a fixed host. An empty base surfaces
      // as the view's `no-url` state, which says "configure the host" rather than showing a broken
      // table. Fill in the host here once it is deployed (no trailing slash); the view appends
      // `/api/returns-ranking`. `localStorage['sattva:amfibeas-base']` overrides it, which is how
      // verify-ui.mjs and a screenshot run point the feed at a stub.
      window.AMFIBEAS_API_BASE = '';
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind CDN config — no build step, no bundler (see CLAUDE.md).
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'sans-serif'],
            },
            // ---- THE PALETTE LIVES HERE, AND THE SCALE NAMES ARE TAILWIND'S, NOT DESCRIPTIONS. ----
            // Every colour in this app is a Tailwind utility (~1,600 of them across 27 files), so
            // the palette is changed by REDEFINING THE SCALES rather than by rewriting the classes.
            // `indigo`/`purple`/`pink` are the BRAND RAMP SLOTS and now carry champagne gold;
            // `emerald`/`amber`/`rose` are the SEMANTIC SLOTS and still mean pass / partial / fail;
            // `slate` is the warm parchment-and-ink chassis. A class named `indigo-600` is the
            // brand's action colour — it is not indigo, and nothing should be read from the name.
            //
            // Rewriting the classes instead would have cost 1,600 edits AND broken verify-ui.mjs,
            // which asserts on `from-indigo-500` (the freshness hero) and `bg-indigo-500` (the live
            // pill) — those assertions are about the ROLE, and the role has not moved.
            colors: {
              // Parchment → ink. 50–200 are surfaces and hairlines, 300 is the glyph tier
              // (em dashes, sort carets, the hollow watchlist star), 400–900 is text.
              slate: {
                50: '#faf8f1',
                100: '#efeadd',
                200: '#e4ddcd',
                300: '#928da1',
                400: '#736f88',
                500: '#6b6880',
                600: '#55516b',
                700: '#3d3a52',
                800: '#26233d',
                900: '#1a1830',
              },
              // Brand ramp start — champagne. 400/500 are FILLS, 600+ are the only steps that may
              // carry text: #b8923c under small text is 2.9:1, so it is deliberately absent here.
              indigo: {
                50: '#fbf7ec',
                100: '#f4ecd8',
                200: '#ecdcae',
                300: '#ddc998',
                400: '#d9c48f',
                500: '#c3a962',
                600: '#8a6a1c',
                700: '#7d5f16',
                800: '#5f4711',
                900: '#43320b',
              },
              // Brand ramp middle.
              purple: {
                50: '#fdf9f0',
                100: '#f7efdc',
                200: '#efe0bb',
                300: '#e6d3a3',
                400: '#dfcb99',
                500: '#d9c48f',
                600: '#b8923c',
                700: '#8a6a1c',
                800: '#6f5415',
                900: '#5f4711',
              },
              // Brand ramp end.
              pink: {
                50: '#fdfaf3',
                100: '#f9f2e2',
                200: '#f3e7c9',
                300: '#efe0b9',
                400: '#eedfb4',
                500: '#ecdcae',
                600: '#c3a962',
                700: '#8a6a1c',
                800: '#6f5415',
                900: '#5f4711',
              },
              // Semantic — pass.
              emerald: {
                50: '#e8f3ee',
                100: '#d3e8de',
                200: '#a9d3c0',
                300: '#6bb99b',
                400: '#199e70',
                500: '#0b8a5f',
                600: '#047857',
                700: '#045f45',
                800: '#044a37',
                900: '#033a2b',
              },
              // Semantic — partial. Browner and more orange than the brand gold on purpose:
              // see the note in CLAUDE.md about the one adjacency this palette has to hold.
              amber: {
                50: '#fdf3e2',
                100: '#fbe8c8',
                200: '#f5d193',
                300: '#e2ac4e',
                400: '#c98a1c',
                500: '#b4780f',
                600: '#9a5c09',
                700: '#92560a',
                800: '#7a4708',
                900: '#5e3606',
              },
              // Semantic — fail.
              rose: {
                50: '#fdecec',
                100: '#fbdada',
                200: '#f4b4b4',
                300: '#e58a8a',
                400: '#d55555',
                500: '#c92a2a',
                600: '#b91c1c',
                700: '#991b1b',
                800: '#7f1d1d',
                900: '#651414',
              },
              // The two cool families used decoratively (never semantically) are pulled onto the
              // chart palette so a stray swatch cannot be the one cold thing on an ivory page.
              // The three decorative accents that survive as their own hue — panel and provenance
              // tints that need to differ from each other, not to mean anything. Warm-shifted so
              // they sit on parchment, with every text step at AA (5.0–12.4:1 on white).
              violet: { 50: '#f6f2fb', 100: '#ece4f7', 200: '#d9c9ef', 300: '#c0a8e3', 400: '#9d7dd1', 500: '#7f5cc2', 600: '#6d4bb5', 700: '#5b3f9e', 800: '#4a3480', 900: '#3a2a63' },
              sky: { 50: '#eef6f9', 100: '#daebf2', 200: '#b2d7e6', 300: '#7fbdd4', 400: '#3f9dbe', 500: '#1a83a5', 600: '#12768f', 700: '#0d6a86', 800: '#0b566d', 900: '#09455a' },
              teal: { 50: '#eef6f4', 100: '#d8ece7', 200: '#a9d6cd', 300: '#6fbcae', 400: '#2b9d8a', 500: '#158b78', 600: '#0f7d6c', 700: '#0d6659', 800: '#0b5348', 900: '#08423a' },
              blue: { 50: '#eef0fd', 100: '#dfe2fb', 200: '#c3c8f7', 300: '#a3abf3', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
              fuchsia: { 50: '#fdeef4', 100: '#fbdde9', 200: '#f4b9cd', 300: '#ea94b1', 400: '#e0709b', 500: '#d4527f', 600: '#b93d67', 700: '#992f53', 800: '#7c2743', 900: '#661f37' },
            },
          },
        },
      };
    </script>

    <style>
      /* ---- Design tokens. Keep every colour decision traceable to one of these. ----
         Brand ramp is champagne: gold → champagne → pale champagne. Emerald/amber/rose are
         reserved strictly for semantic rule states (pass / partial / fail) and must never be
         used as brand. These mirror the Tailwind scales configured above — the scales are what
         the utilities read, these are for the handful of places that need a raw CSS value. */
      :root {
        --brand-500: #c3a962; /* champagne-600 — brand ramp start (FILL ONLY) */
        --brand-600: #8a6a1c; /* deep gold — links, actions, active nav, focus rings */
        --brand-mid: #d9c48f; /* champagne-500 — brand ramp middle (FILL ONLY) */
        --brand-end: #ecdcae; /* champagne-400 — brand ramp end (FILL ONLY) */
        --accent-600: #8a6a1c; /* deep gold — accent for links/actions */

        /* THE BRAND GRADIENT CARRIES INK, NEVER WHITE. White on #ecdcae is 1.36:1 and on
           #b8923c is 2.9:1 — under the floor at both ends of the ramp, and under even the
           3:1 large-text allowance. Ink on the same three is 7.5 / 10.1 / 12.7:1. */
        --brand-ink: #1a1830;

        /* Semantic states — rule outcomes only, never brand. Each is the darkest step that
           still reads as its hue, because every one of them lands on white or on parchment. */
        --positive: #047857; /* emerald — pass (5.48:1 on white) */
        --caution: #9a5c09; /* amber — partial (5.37:1) */
        --negative: #b91c1c; /* rose — fail (6.47:1) */
        --hard-fail: #991b1b; /* rose-700 — hard fail (8.31:1) */
        --neutral: #6b6880; /* warm slate — n/a (5.36:1) */

        --page-bg: #f4f2ec;
        --surface: #ffffff;
        --ink-900: #1a1830;
        --ink-600: #55516b;
        --ink-400: #736f88;
        --radius-surface: 1rem;
      }

      html {
        scroll-behavior: smooth;
        /* The closed drill panel is position:fixed and parked at translateX(100%), i.e. just
           off the right edge. `overflow-x` on <body> does not clip fixed elements, so without
           this the parked panel widens the document and the page scrolls sideways. */
        overflow-x: hidden;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink-900);
        /* Parchment, with a faint 32px rule grid over it. The three cool radial washes this
           replaces were the only violet/pink/sky left on the page once the ramp went gold. */
        background-color: #f4f2ec;
        background-image:
          linear-gradient(rgba(60, 55, 100, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(60, 55, 100, 0.05) 1px, transparent 1px);
        background-size: 32px 32px;
        min-height: 100vh;
        /* The page body must never scroll sideways — wide tables scroll inside their own
           overflow-x container instead (see scoreTable in ui/screener.js). */
        overflow-x: hidden;
      }

      .font-display {
        font-family: 'Plus Jakarta Sans', 'Inter', ui-sans-serif, sans-serif;
      }

      /* Tabular numerals — every number-bearing cell uses fixed-width digits so columns line up. */
      table tbody td,
      table thead th,
      .stat-card,
      [data-numeric] {
        font-variant-numeric: tabular-nums;
      }
      .tabular-nums,
      [class*='tabular-nums'] {
        font-variant-numeric: tabular-nums;
      }

      /* Slim scrollbars for table bodies, drill panels and dropdowns. */
      .scrollbar-thin::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: rgba(60, 55, 100, 0.22);
        border-radius: 4px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background: rgba(60, 55, 100, 0.4);
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fade-in 0.4s ease-out both;
      }

      /* Header refresh button, while it is checking the feeds. */
      @keyframes spin-slow {
        to {
          transform: rotate(360deg);
        }
      }
      .spin-slow {
        animation: spin-slow 0.9s linear infinite;
        transform-origin: center;
      }

      /* Top-tab nav — springy champagne underline that scales in on the active tab. */
      .tab-btn {
        position: relative;
      }
      .tab-btn::after {
        content: '';
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: -1px;
        height: 3px;
        border-radius: 3px 3px 0 0;
        background: linear-gradient(90deg, #b8923c, #d9c48f);
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .tab-btn.is-active::after {
        transform: scaleX(1);
      }
      .tab-btn.is-active {
        background: linear-gradient(180deg, transparent 60%, rgba(184, 146, 60, 0.08) 100%);
      }

      /* scoreTable row numbers come from a CSS counter, not from the markup — that keeps each
         row's HTML position-independent so sorting can reorder cached strings instead of
         regenerating 500+ rows. */
      tbody {
        counter-reset: sattva-row;
      }
      tbody tr.row-line {
        counter-increment: sattva-row;
      }
      .row-rank::before {
        content: counter(sattva-row);
      }

      /* Drill-panel provenance chips use <details>; hide the default disclosure triangle
         so the summary renders as a clean chip. */
      .meta-details > summary::-webkit-details-marker { display: none; }
      .meta-details > summary { list-style: none; }
      .meta-details > summary::marker { content: ''; }

      /* Right-slide drill panel + centred modal transitions (ui/screener.js). */
      .drill-panel {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #modal-overlay.is-open {
        display: flex;
      }
      #modal-overlay.is-open #modal-container {
        opacity: 1;
        transform: scale(1);
      }

      /* Full-screen workspace overlay (ui/screener.js openWorkspace) — the Con-call Deep Dive
         lives here. Bigger than the drill panel because it carries its own tab strip. */
      #workspace-overlay.is-open {
        display: flex;
      }
      #workspace-overlay.is-open #workspace-container {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      /* Set on <body> while a workspace is open so the page behind cannot scroll. */
      body.workspace-open {
        overflow: hidden;
      }

      /* Shimmer used by the skeleton primitive. */
      .skeleton-shimmer {
        position: relative;
        overflow: hidden;
      }
      .skeleton-shimmer::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0) 100%);
        animation: shimmer 1.6s infinite;
      }
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      /* Restrained scrollbars inside table containers and dropdowns. */
      ::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(60, 55, 100, 0.18);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(60, 55, 100, 0.34);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body class="text-slate-800">
    <div id="app">
      <!-- Shell (header, rail, tabs, content host) is mounted by js/ui/shell.js. -->
      <div class="mx-auto max-w-lg px-6 py-24 text-center text-sm text-slate-400">Loading Glow Central Research…</div>
    </div>

    <!-- Overlay layer, owned by ui/screener.js. Both are singletons: any tab can open the
         right-slide drill panel or the centred modal without mounting its own copy. -->
    <div id="drill-overlay" class="fixed inset-0 z-40 hidden bg-slate-900/30 backdrop-blur-sm"></div>
    <aside
      id="drill-panel"
      class="drill-panel scrollbar-thin fixed right-0 top-0 z-50 h-full w-full translate-x-full overflow-y-auto bg-white shadow-2xl sm:w-[480px]"
    >
      <div id="drill-content"></div>
    </aside>

    <div
      id="modal-overlay"
      class="fixed inset-0 z-[60] hidden items-center justify-center overflow-y-auto bg-slate-900/60 p-4 backdrop-blur-sm sm:p-8"
    >
      <div id="modal-container" class="relative my-8 w-full max-w-4xl scale-95 overflow-hidden rounded-3xl bg-white opacity-0 shadow-2xl transition-all duration-200">
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- Full-screen workspace overlay, owned by ui/screener.js.
         Stacking order is deliberate: drill (z-50) < workspace (z-55) < modal (z-60), so the
         keyword editor — a modal opened from inside the Deep Dive — lands on top of it rather
         than behind it. -->
    <div
      id="workspace-overlay"
      class="fixed inset-0 z-[55] hidden items-start justify-center overflow-y-auto bg-slate-900/70 p-0 backdrop-blur-sm sm:p-6"
    >
      <div
        id="workspace-container"
        class="relative w-full max-w-[1200px] translate-y-4 scale-[0.98] overflow-hidden rounded-none bg-white opacity-0 shadow-2xl transition-all duration-200 sm:my-4 sm:rounded-3xl"
      >
        <div id="workspace-content"></div>
      </div>
    </div>

    <!-- Live alert stack, owned by ui/notifications.js, which creates this node if it is absent.
         z-30 is deliberate and sits BELOW every overlay above: a toast announcing a result must
         never land on top of a drill panel or a workspace the reader opened on purpose. -->
    <div
      id="notification-root"
      role="status"
      aria-live="polite"
      class="pointer-events-none fixed bottom-4 right-4 z-30 flex w-[min(22rem,calc(100vw-2rem))] flex-col-reverse gap-2"
    ></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
