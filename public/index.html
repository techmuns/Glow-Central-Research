<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sattva Central Research</title>
    <meta name="description" content="Sattva Central Research — an Indian equities research and portfolio analytics dashboard." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='800' fill='white' text-anchor='middle'%3ESC%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind CDN config — no build step, no bundler (see CLAUDE.md).
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <style>
      /* ---- Design tokens. Keep every colour decision traceable to one of these. ---- */
      :root {
        --brand-600: #0d9488; /* teal — primary */
        --brand-700: #059669; /* emerald — primary gradient end */
        --accent-600: #7c3aed; /* violet — secondary accent */
        --positive: #059669;
        --caution: #d97706;
        --negative: #e11d48;
        --neutral: #64748b;
        --page-bg: #f8fafc;
        --surface: #ffffff;
        --ink-900: #0f172a;
        --ink-600: #475569;
        --ink-400: #94a3b8;
        --radius-surface: 1rem;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        background-color: var(--page-bg);
        color: var(--ink-900);
        /* Three soft radial washes, all well under 12% opacity: teal top-left, violet
           top-right, sky bottom-right. Fixed so they don't slide as content scrolls. */
        background-image:
          radial-gradient(60rem 40rem at 0% 0%, rgba(13, 148, 136, 0.1), transparent 60%),
          radial-gradient(55rem 38rem at 100% 0%, rgba(124, 58, 237, 0.09), transparent 62%),
          radial-gradient(60rem 45rem at 100% 100%, rgba(14, 165, 233, 0.08), transparent 60%);
        background-attachment: fixed;
        background-repeat: no-repeat;
        min-height: 100vh;
        /* The page body must never scroll sideways — wide tables scroll inside their own
           overflow-x container instead (see dataTable in ui/components.js). */
        overflow-x: hidden;
      }

      .font-display {
        font-family: 'Plus Jakarta Sans', 'Inter', ui-sans-serif, sans-serif;
      }

      /* Every number-bearing cell lines up column-to-column. */
      table,
      .tabular-nums,
      [class*='tabular-nums'] {
        font-variant-numeric: tabular-nums;
      }

      /* Shimmer used by the skeleton primitive. */
      .skeleton-shimmer {
        position: relative;
        overflow: hidden;
      }
      .skeleton-shimmer::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0) 100%);
        animation: shimmer 1.6s infinite;
      }
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      /* Restrained scrollbars inside table containers and dropdowns. */
      ::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Shell (header, rail, tabs, content host) is mounted by js/ui/shell.js. -->
      <div class="mx-auto max-w-lg px-6 py-24 text-center text-sm text-slate-400">Loading Sattva Central Research…</div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
