name: Technicals refresh

# The dashboard's one genuinely live feed. Pulls ~400 calendar days of daily OHLCV per
# company from Yahoo Finance plus NSE bhavcopy delivery %, recomputes every indicator, and
# commits public/data/technicals.json + public/data/atr-history.json back to main.
#
# The ATR accumulator only grows when this runs, so a missed day is a missed data point for
# the ATR-trend half of the ATR Stability rule — the rule degrades to scoring on the absolute
# level alone and says so, rather than guessing.

on:
  schedule:
    # 01:30 UTC = 07:00 IST, weekdays. Indian markets close at 15:30 IST, so this picks up
    # the previous session's closing data before the next one opens.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:

# Only one refresh in flight at a time — two concurrent runs would race on the same two
# committed JSON files.
concurrency:
  group: technicals-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run technicals scraper
        run: node scripts/scrape-technicals.mjs

      - name: Upload technicals data (artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: technicals-data
          path: |
            public/data/technicals.json
            public/data/atr-history.json
          if-no-files-found: warn

      - name: Commit refreshed technicals to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/technicals.json
          [ -f public/data/atr-history.json ] && git add public/data/atr-history.json || true
          if git diff --cached --quiet; then
            echo "No technicals changes to commit."
            exit 0
          fi
          git commit -m "Daily technicals refresh ($(date -u +%Y-%m-%d))"
          # Another job may have pushed while the scrape was running (it takes ~10 min).
          # Retry with a fetch + rebase between attempts rather than force-pushing.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
