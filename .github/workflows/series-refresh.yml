name: GlowVentures sync (series store + family book)

# TWO THINGS RIDE ONE CLONE OF techmuns/GlowVentures, every day:
#
#   • THE MACRO SERIES STORE behind the Macro Research and Economy & Macro tabs, harvested there
#     (`npm run harvest`, nightly at 02:00 UTC) and committed under `public/series/`. Copied here
#     verbatim so both dashboards read the same figures and this repository carries no harvester
#     of its own — one source of truth for a store that is measured, not computed, on either side.
#   • THE FAMILY OFFICE BOOK behind the Family Book tab and Ask Research's portfolio source, AND THE
#     FAMILY'S MANAGERS behind My Managers on the Super Investors tab (scripts/build-managers.mjs). That
#     repository assembles it offline from the wealth platforms' PDF statements and bakes it into
#     `src/data/glowData.ts`; `scripts/build-book.mjs` reads the generated arrays out of it and
#     writes `public/data/book.json`, and `scripts/check-book.mjs` refuses a file whose sums do
#     not reconcile to the upstream headline — so a bad build commits nothing.
#
# See docs/DATA-CONTRACTS.md — "The macro series store" and "public/data/book.json".
#
# IT NEEDS ONE SECRET, because that repository is private: GLOWVENTURES_READ_TOKEN, a fine-grained
# GitHub personal access token for techmuns/GlowVentures with the single permission
# "Contents: read". Without it the job says so and exits green — the committed copies simply age,
# and both tabs print their capture time on every visit so nobody mistakes it for today's.

on:
  schedule:
    # 03:30 UTC = 09:00 IST daily, ninety minutes after the GlowVentures harvest.
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: series-refresh
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone GlowVentures and copy the series store
        env:
          TOKEN: ${{ secrets.GLOWVENTURES_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=GlowVentures sync skipped::GLOWVENTURES_READ_TOKEN is not set as a repository secret, so neither the series store nor the family office book was refreshed. Add a fine-grained PAT for techmuns/GlowVentures with Contents: read."
            echo "### Skipped — no GLOWVENTURES_READ_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "The committed series store and book were left as they are. Add the secret under Settings → Secrets and variables → Actions to refresh them daily." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/techmuns/GlowVentures.git" /tmp/glowventures
          src_sha=$(git -C /tmp/glowventures rev-parse --short HEAD)
          rsync -a --delete /tmp/glowventures/public/series/ public/data/series/
          echo "SRC_SHA=$src_sha" >> "$GITHUB_ENV"
          echo "Copied $(find public/data/series -type f | wc -l) series files from techmuns/GlowVentures@$src_sha"

      # THE BOOK AND THE PORTFOLIO SCOPE'S LIST, from the same checkout — same source, same day, same
      # commit. build-book.mjs writes public/data/portfolio-companies.json (what the Portfolio toggle
      # filters by) beside book.json; the upstream family-book-sync.yml is NOT scheduled here because
      # it reads the Sattva family's book. `check-book.mjs`
      # exits non-zero when the consolidated sum (each duplicate counted once) is not the upstream
      # headline, when a dedupe group has one member, or when the ring-fenced holding is inside
      # the positions; the job then fails here and the commit step never runs.
      - name: Build and reconcile the family office book
        if: env.SRC_SHA != ''
        run: |
          GLOWVENTURES_DIR=/tmp/glowventures node scripts/build-book.mjs
          node scripts/check-book.mjs

      # THE FAMILY'S MANAGERS, from the same checkout — the statements archive and the look-through
      # beside the book. build-managers.mjs refuses to write when the managed and direct values do
      # not add back to the book's headline, so a bad build commits nothing here either.
      - name: Build and reconcile the family's managers
        if: env.SRC_SHA != ''
        run: GLOWVENTURES_DIR=/tmp/glowventures node scripts/build-managers.mjs

      # THE BOOK AND THE PRICES MUST NOT DRIFT APART, AND THEY ARE BUILT BY DIFFERENT WORKFLOWS.
      #
      # `scrape-technicals.mjs` already prices the NSE 500 export PLUS the book — a holding is
      # priced because it is HELD. But it runs on its own cron in technicals-refresh.yml, so the
      # day the book gains companies here, the capture does not have them until that job next
      # fires. Measured when the book was rebuilt from the family's own statements: 142 lines to
      # 170, and 87 of them had no technicals row for the rest of the day. Every research tab that
      # reads a price silently skipped them and nothing on screen said so; the only thing that
      # noticed was one assertion in verify-ui.mjs, which is not CI.
      #
      # So the run that GROWS the book also fills the prices it just made missing. `TECH_FILL_GAPS=1`
      # fetches only the names the committed file lacks and merges them, which is a few requests
      # rather than a 600-company re-fetch — the script's own header explains why the merged rows
      # are not equivalent to a full run and how the payload records that.
      #
      # A FAILED FILL DOES NOT FAIL THE SYNC. The book is still correct and still worth committing,
      # and the next scheduled technicals run fills the gap anyway; failing here would throw away a
      # good book because somebody else's price API was briefly unavailable. It warns instead, which
      # is the same posture the Moneycontrol scrape takes for a blocked runner.
      - name: Price any holdings the new book added
        if: env.SRC_SHA != ''
        run: |
          set +e
          node scripts/check-technicals-coverage.mjs
          gap=$?
          set -e
          if [ "$gap" = "0" ]; then
            echo "Every listed holding already has a technicals row."
            exit 0
          fi
          if [ "$gap" != "3" ]; then
            echo "::warning title=Technicals coverage could not be checked::check-technicals-coverage.mjs exited $gap — see the log. The book is unaffected and is still committed."
            exit 0
          fi
          echo "The book gained holdings the price capture does not carry — filling just those."
          if TECH_FILL_GAPS=1 node scripts/scrape-technicals.mjs; then
            node scripts/check-technicals-coverage.mjs || \
              echo "::warning title=Some holdings are still unpriced::The gap-fill ran but did not reach every new holding. The next scheduled technicals run will retry."
          else
            echo "::warning title=Price gap-fill failed::The new holdings have no technicals row yet. The book is still correct and is committed; technicals-refresh.yml will fill them on its next run."
          fi

      - name: Commit the refreshed store and book to main
        if: env.SRC_SHA != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # technicals.json is staged because the step above may have filled prices for holdings
          # this very run added. It is a no-op on the ordinary day when the book did not grow.
          git add -A public/data/series public/data/book.json public/data/portfolio-companies.json public/data/managers.json public/data/technicals.json
          if git diff --cached --quiet; then
            echo "The series store and the book are already current."
            echo "### Already current — nothing to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "GlowVentures sync ($(date -u +%Y-%m-%d)) — series store and family book from techmuns/GlowVentures@${SRC_SHA}"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
