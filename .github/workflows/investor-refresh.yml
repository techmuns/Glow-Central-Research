name: Investor holdings refresh

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: investor-holdings-refresh
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Capture every investor and retain failed books
        id: capture
        continue-on-error: true
        run: node scripts/scrape-super-investors.mjs
      - name: Read original exchange filings across all listed companies
        id: primary
        continue-on-error: true
        run: node scripts/capture-shareholdings.mjs
      - name: Reconcile legal holders, securities, dates and percentages
        run: node scripts/reconcile-shareholdings.mjs
      - name: Audit every investor and manager
        id: audit
        continue-on-error: true
        # This run answers for the Finology books and the exchange filings it captured. The
        # managers' statement archive is series-refresh.yml's capture: an age on it is printed
        # here as a warning naming that workflow, never as this run's failure.
        env:
          HOLDINGS_AUDIT_OWNS: investors,exchange
        run: node scripts/audit-holdings.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: holdings-coverage-audit
          path: /tmp/holdings-audit.json
      - name: Commit the capture and failure metadata to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/super-investors.json public/data/shareholding-filings.json.gz public/data/public-holdings.json
          if git diff --cached --quiet; then
            echo "No investor-holdings changes to commit."
            exit 0
          fi
          git commit -m "Investor holdings refresh ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
      - name: Surface failed or overdue ingestion
        if: steps.capture.outcome == 'failure' || steps.primary.outcome == 'failure' || steps.audit.outcome == 'failure'
        run: |
          # One error per cause, in words, so the red run says what happened rather than only that
          # something did. Last-good data is preserved in every case.
          if [ "${{ steps.capture.outcome }}" = "failure" ]; then
            echo "::error title=Finology capture did not complete::The super-investor books could not all be read from the Worker relay (devde.muns.io behind it). Retained books keep their last read time; see the Finology capture section of this summary."
          fi
          if [ "${{ steps.primary.outcome }}" = "failure" ]; then
            echo "::error title=Exchange filings capture did not complete::Some NSE/BSE shareholding filings could not be read this run. Successful reads are retained; unread filings stay in the review queue."
          fi
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then
            echo "::error title=This run's sources are overdue::The coverage audit found an investor book or exchange capture older than policy allows. See the Holdings coverage section of this summary."
          fi
          exit 1
