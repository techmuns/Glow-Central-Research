name: Filings refresh

# The committed snapshot behind Corporate Announcements, Insider Trades and News.
#
#   scrape-filings.mjs   walks the TRACKED UNIVERSE (~1,900 listed companies above a market-cap
#                        floor — scripts/import-tracked-universe.mjs), book first then biggest-first,
#                        and commits news.json, corp-announcements.json and insider-trades.json.
#
# WHY THIS JOB EXISTS. The filings tabs are cache-first: the browser NEVER walks the universe on
# mount (that would be ~1,900 rate-limited requests on every visit). It paints the committed snapshot
# this job writes, and a Refresh button tops up a bounded batch on demand. So this snapshot is the
# ONLY thing that shows all ~1,900 companies at once — without this run, the tabs show only what a
# reader has pressed Refresh to fetch.
#
# IT IS A LONG JOB. Two of the three feeds are per-ticker and all three are rate limited to ~60
# requests a minute, so ~1,900 companies × three feeds is well over an hour even before retries. The
# scraper walks the book first and writes what it got even if it is cut short, so a run that hits the
# timeout still commits the largest companies (the priority) rather than nothing.
#
# IT NEEDS A TOKEN. The Muns filings API wants a bearer token; set it as the repo secret MUNS_TOKEN
# (and MUNS_NEWS_TOKEN if the news endpoint uses a separate one). Without it every company records an
# `unauthorised` failure and the snapshot is written empty — which is the tabs' current state.

on:
  schedule:
    # 02:30 UTC = 08:00 IST, weekdays — after the technicals refresh (01:30 UTC), so the two long
    # jobs do not start together. Both push to main; the commit step below fetches + rebases on a
    # rejected push rather than racing.
    - cron: "30 2 * * 1-5"
  workflow_dispatch:

# Its own group, separate from the technicals refresh, so the two can overlap without cancelling each
# other — they write different files and reconcile at push time.
concurrency:
  group: filings-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Generous, because ~1,900 companies × three rate-limited feeds is over an hour. A cut-short run
    # still commits what it got (book first, biggest-first), so this is a ceiling, not a target.
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Walks the tracked universe for all three feeds. Writes news.json, corp-announcements.json and
      # insider-trades.json, recording per-company failures inside each file rather than dropping them.
      - name: Run filings scraper
        env:
          MUNS_TOKEN: ${{ secrets.MUNS_TOKEN }}
          MUNS_NEWS_TOKEN: ${{ secrets.MUNS_NEWS_TOKEN }}
        run: node scripts/scrape-filings.mjs

      - name: Upload filings data (artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: filings-data
          path: |
            public/data/news.json
            public/data/corp-announcements.json
            public/data/insider-trades.json
          if-no-files-found: warn

      - name: Commit refreshed filings to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in news corp-announcements insider-trades; do
            [ -f "public/data/$f.json" ] && git add "public/data/$f.json" || true
          done
          if git diff --cached --quiet; then
            echo "No filings changes to commit."
            exit 0
          fi
          git commit -m "Filings snapshot refresh ($(date -u +%Y-%m-%d))"
          # The technicals refresh or a manual push may have landed while this ran (it takes over an
          # hour). Retry with fetch + rebase rather than force-pushing.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
