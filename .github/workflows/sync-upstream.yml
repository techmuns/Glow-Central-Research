name: Sync from Sattva
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare the upstream merge on a review branch
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
        run: |
          git remote add sattva https://github.com/techmuns/Sattva-Central-Research.git
          git config remote.sattva.promisor true
          git config remote.sattva.partialclonefilter blob:none
          git fetch --filter=blob:none sattva main:refs/remotes/sattva/main
          common=$(node -p "JSON.parse(require('fs').readFileSync('docs/GLOW-TEMPLATE-BASELINE.json')).revision")
          git fetch --filter=blob:none sattva "$common"
          if git diff --quiet "$common" sattva/main -- . ':!public/data'; then
            echo "Only Sattva capture data changed; Glow keeps its own collectors and needs no template PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          upstream=$(git rev-parse sattva/main)
          branch="codex/sattva-sync-${upstream:0:12}"
          existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "An existing PR already covers this template revision: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A previous attempt may have pushed before its token could create a PR.
          # Recover that branch instead of making a conflicting replacement commit.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            body="$RUNNER_TEMP/sattva-sync-recovery.md"
            echo "Recover the existing template review branch for $upstream. Inspect its prior sync run, resolve any conflicts, and pass Verify before merging." > "$body"
            gh pr create --draft --base main --head "$branch" --title "Review Sattva template sync (${upstream:0:12})" --body-file "$body"
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Apply only the incremental source diff. Recording its exact revision avoids importing
          # Sattva's generated capture ancestry into Glow and keeps every Glow capture untouched.
          # Three-way application retains Glow integrations or leaves explicit conflicts for review.
          node scripts/prepare-glow-template-patch.mjs "$common" "$upstream" "$RUNNER_TEMP/sattva-source.patch"
          if [ -s "$RUNNER_TEMP/sattva-source.patch" ]; then
            if ! git apply --3way --index "$RUNNER_TEMP/sattva-source.patch"; then
              test -n "$(git diff --name-only --diff-filter=U)"
            fi
          fi
          node scripts/adapt-glow-template.mjs
          node scripts/prepare-glow-template-patch.mjs --record "$upstream"
          conflicts=$(git diff --name-only --diff-filter=U)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ -n "$conflicts" ]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$conflicts" > "$RUNNER_TEMP/sattva-conflicts.txt"
          else
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate a resolved merge
        if: steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.conflict == 'false'
        id: validate
        continue-on-error: true
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i scripts/tailwind-input.css -o public/css/tailwind.css --minify
          node --experimental-vm-modules --no-warnings scripts/verify-syntax.mjs
          node scripts/rebuild-glow-capture-index.mjs
          node scripts/verify-glow-parity.mjs
          node scripts/check-book.mjs
          npx --yes wrangler@4 deploy --dry-run
      - name: Publish the review branch and open a PR
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          UPSTREAM: ${{ steps.prepare.outputs.upstream }}
          CONFLICT: ${{ steps.prepare.outputs.conflict }}
          CHECKED: ${{ steps.validate.outcome }}
        run: |
          git add -A
          git commit -m "Sync Sattva source ${UPSTREAM:0:12} into Glow"
          git push origin "HEAD:refs/heads/$BRANCH"
          body="$RUNNER_TEMP/sattva-sync-pr.md"
          {
            echo "Imports the merged Sattva dashboard template at $UPSTREAM while preserving Glow's portfolio captures and deployment identity."
            echo
            echo "The full Verify workflow and reviewer feedback must be checked before merging. This workflow never pushes to main or bypasses a review gate."
            if [ "$CONFLICT" = true ]; then
              echo
              echo "Resolve these merge conflicts before marking this draft ready:"
              cat "$RUNNER_TEMP/sattva-conflicts.txt"
            fi
            if [ "$CHECKED" != success ]; then
              echo
              echo "Local merge checks did not complete successfully; inspect this workflow run."
            fi
          } > "$body"
          draft=()
          if [ "$CONFLICT" = true ] || [ "$CHECKED" != success ]; then draft=(--draft); fi
          if ! url=$(gh pr create --base main --head "$BRANCH" --title "Sync Sattva template into Glow (${UPSTREAM:0:12})" --body-file "$body" "${draft[@]}"); then
            echo "::error::SYNC_PUSH_TOKEN must allow Contents, Workflows and Pull requests read/write on Glow-Central-Research. The review branch is preserved; no main push was attempted."
            exit 1
          fi
          # ONE OPEN SYNC PR AT A TIME. Sattva's main moves several times a day, so a fresh sync
          # branch every six hours left 29 drafts open on 17 September 2026, each one a strict
          # subset of the next. The newest carries everything the older ones did, so the older
          # ones are closed as superseded. Their branches are kept: a person part-way through
          # resolving a conflict on one loses nothing and can reopen it.
          gh pr list --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("codex/sattva-sync-")) | select(.headRefName != env.BRANCH) | .number' | \
          while read -r number; do
            gh pr close "$number" --comment "Superseded by $url, which syncs a later Sattva revision. This branch is kept."
          done
