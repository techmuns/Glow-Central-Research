name: Sync from Sattva
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare the upstream merge on a review branch
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
        run: |
          git fetch https://github.com/techmuns/Sattva-Central-Research.git main:refs/remotes/sattva/main
          if git merge-base --is-ancestor sattva/main HEAD; then
            echo "Sattva's merged changes are already included." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          common=$(git merge-base sattva/main HEAD)
          if git diff --quiet "$common" sattva/main -- . ':!public/data'; then
            echo "Only Sattva capture data changed; Glow keeps its own collectors and needs no template PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          upstream=$(git rev-parse sattva/main)
          branch="codex/sattva-sync-${upstream:0:12}"
          existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "An existing PR already covers this template revision: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A previous attempt may have pushed before its token could create a PR.
          # Recover that branch instead of making a conflicting replacement commit.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            body="$RUNNER_TEMP/sattva-sync-recovery.md"
            echo "Recover the existing template review branch for $upstream. Inspect its prior sync run, resolve any conflicts, and pass Verify before merging." > "$body"
            gh pr create --draft --base main --head "$branch" --title "Review Sattva template sync (${upstream:0:12})" --body-file "$body"
            exit 0
          fi
          base=$(git rev-parse HEAD)
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.ours.driver true
          if ! git merge --no-ff --no-commit sattva/main; then
            # Continue only for an actual conflicted merge, not an unrelated Git failure.
            test -f "$(git rev-parse --git-path MERGE_HEAD)"
          fi
          # Keep every pre-existing Glow capture, including upstream-only modifications.
          # The custom merge driver alone does not protect one-sided changes.
          git ls-tree -rz --name-only "$base" -- public/data | \
            git restore --source="$base" --staged --worktree --pathspec-from-file=- --pathspec-file-nul
          for cache in public/data/filing-capture/portfolio.json public/data/tradingview-news/portfolio.json public/data/filing-capture/registrations.json; do
            if ! git cat-file -e "$base:$cache" 2>/dev/null; then git rm -f --ignore-unmatch "$cache"; fi
          done
          node scripts/adapt-glow-template.mjs
          conflicts=$(git diff --name-only --diff-filter=U)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ -n "$conflicts" ]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$conflicts" > "$RUNNER_TEMP/sattva-conflicts.txt"
          else
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate a resolved merge
        if: steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.conflict == 'false'
        id: validate
        continue-on-error: true
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i scripts/tailwind-input.css -o public/css/tailwind.css --minify
          node --experimental-vm-modules --no-warnings scripts/verify-syntax.mjs
          node scripts/rebuild-glow-capture-index.mjs
          node scripts/verify-glow-parity.mjs
          node scripts/check-book.mjs
          npx --yes wrangler@4 deploy --dry-run
      - name: Publish the review branch and open a PR
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          UPSTREAM: ${{ steps.prepare.outputs.upstream }}
          CONFLICT: ${{ steps.prepare.outputs.conflict }}
          CHECKED: ${{ steps.validate.outcome }}
        run: |
          git add -A
          git commit -m "Merge Sattva template ${UPSTREAM:0:12} into Glow"
          git push origin "HEAD:refs/heads/$BRANCH"
          body="$RUNNER_TEMP/sattva-sync-pr.md"
          {
            echo "Imports the merged Sattva dashboard template at $UPSTREAM while preserving Glow's portfolio captures and deployment identity."
            echo
            echo "The full Verify workflow and reviewer feedback must be checked before merging. This workflow never pushes to main or bypasses a review gate."
            if [ "$CONFLICT" = true ]; then
              echo
              echo "Resolve these merge conflicts before marking this draft ready:"
              cat "$RUNNER_TEMP/sattva-conflicts.txt"
            fi
            if [ "$CHECKED" != success ]; then
              echo
              echo "Local merge checks did not complete successfully; inspect this workflow run."
            fi
          } > "$body"
          draft=()
          if [ "$CONFLICT" = true ] || [ "$CHECKED" != success ]; then draft=(--draft); fi
          if ! gh pr create --base main --head "$BRANCH" --title "Sync Sattva template into Glow (${UPSTREAM:0:12})" --body-file "$body" "${draft[@]}"; then
            echo "::error::SYNC_PUSH_TOKEN must allow Contents, Workflows and Pull requests read/write on Glow-Central-Research. The review branch is preserved; no main push was attempted."
            exit 1
          fi
