name: Portfolio sheet history refresh

# The dated history behind the Portfolio tab's TSR, XIRR and alpha (GLOW-OWNED): the Nifty 500's
# daily closes since 2005, and every dividend and split each public-direct holding and watchlist
# company has paid, from Yahoo Finance (scripts/scrape-sheet-history.mjs).
#
# Weekdays before the market opens, so yesterday's close and any ex-date since are in. A company
# Yahoo cannot answer keeps the entry the last run captured and is named in `failed`; a run that
# cannot read the index and holds no earlier copy refuses to write. The tab prints this file's own
# run time, so a dropped schedule shows as an older date rather than as current data.
on:
  schedule:
    - cron: "43 2 * * 1-5"
  workflow_dispatch:

run-name: Portfolio sheet history refresh (${{ github.event_name == 'schedule' && 'github-cron' || 'manual' }})

concurrency:
  group: sheet-history-refresh
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Capture dividends, splits and the Nifty 500 history
        run: node scripts/scrape-sheet-history.mjs

      - name: Commit the history to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sheet-history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "Portfolio sheet history refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push failed after 4 attempts."
          exit 1
