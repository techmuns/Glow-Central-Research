concurrency:
  group: family-book-snapshot-pr
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify the sync contract
        run: node scripts/verify-family-sync.mjs
      - name: Read the active shared holdings
        env:
          FAMILY_HOLDINGS_TOKEN: ${{ secrets.FAMILY_HOLDINGS_TOKEN }}
        run: node scripts/sync-family-book.mjs
      - name: Install pinned Screener browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/screener-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/screener-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Mirror the live portfolio into the existing S Screen watchlist
        env:
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          SCREENER_SYNC_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/screener-browser/node_modules/playwright
          DEBUG: ""
          PWDEBUG: ""
        run: node scripts/sync-screener-watchlist.mjs
      - name: Open or update the fallback snapshot PR
        id: fallback_snapshot
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.FAMILY_SYNC_PR_TOKEN || github.token }}
          branch: codex/family-book-snapshot
          base: main
          add-paths: |
            scripts/fixtures/family-book.json
            public/data/portfolio-companies.json
          commit-message: Update active Family Office holdings snapshot
          title: Update active Family Office holdings snapshot
          body: |
            Names-only fallback snapshot from Family Office's active shared workbook.
            Review additions/removals and required checks before merging. No auto-merge or deployment.
            Live Portfolio scope does not wait for this PR.
      - name: Report an unavailable fallback snapshot PR
        if: steps.fallback_snapshot.outcome == 'failure'
        run: echo "::warning::The live portfolio and S Screen sync succeeded, but the optional fallback snapshot PR could not be opened."
