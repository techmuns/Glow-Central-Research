name: Screener access check

# Read-only by default. An explicit manual request can reconcile the named Glow
# watchlist. Credentials and exported holdings stay in runner memory.
on:
  workflow_dispatch:
    inputs:
      announcements_probe:
        description: 'Read-only announcement recovery check in runner temporary storage'
        type: boolean
        default: false
      sync_watchlist:
        description: 'Apply the Glow portfolio to its configured Screener watchlist'
        type: boolean
        default: false
      watchlist_id:
        description: 'When applying, repeat the exact target watchlist ID'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: screener-access-check
  cancel-in-progress: false

jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check the explicitly requested sync target
        if: inputs.sync_watchlist
        env:
          REQUESTED_WATCHLIST_ID: ${{ inputs.watchlist_id }}
          CONFIGURED_WATCHLIST_ID: ${{ vars.SCREENER_WATCHLIST_ID }}
        run: |
          node --input-type=module -e '
            const requested = process.env.REQUESTED_WATCHLIST_ID;
            if (!/^\d+$/.test(requested || "") || requested !== process.env.CONFIGURED_WATCHLIST_ID)
              throw new Error("The requested watchlist must match the configured Glow watchlist.");
          '
      - name: Install pinned Playwright runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/screener-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/screener-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify login and read one company page
        if: ${{ !inputs.announcements_probe }}
        env:
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/screener-browser/node_modules/playwright
          # Playwright debug logs can include form values. Never enable them here.
          DEBUG: ""
          PWDEBUG: ""
        run: node scripts/check-screener-access.mjs
      - name: Check or sync the configured Glow portfolio mirror
        if: ${{ !inputs.announcements_probe }}
        env:
          SCREENER_WATCHLIST_ID: ${{ vars.SCREENER_WATCHLIST_ID }}
          SCREENER_WATCHLIST_NAME: ${{ vars.SCREENER_WATCHLIST_NAME }}
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          SCREENER_SYNC_DRY_RUN: ${{ inputs.sync_watchlist != true }}
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/screener-browser/node_modules/playwright
          DEBUG: ""
          PWDEBUG: ""
        run: node scripts/sync-screener-watchlist.mjs
      - name: Check announcement recovery without publishing or changing watchlists
        if: inputs.announcements_probe
        env:
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/screener-browser/node_modules/playwright
          ANN_CHECK_FROM: '2026-09-29T10:40:00.000Z'
          ANN_CHECK_TO: '2026-09-29T11:10:00.000Z'
          ANN_MAX_PAGES: '12'
          DEBUG: ""
          PWDEBUG: ""
        run: |
          node scripts/collect-screener-announcements.mjs "$RUNNER_TEMP/announcements-probe"
          node scripts/check-announcement-recovery-probe.mjs "$RUNNER_TEMP/announcements-probe"
