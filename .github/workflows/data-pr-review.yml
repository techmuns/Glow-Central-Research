name: Review generated data publication
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
concurrency:
  group: data-pr-review-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Merge only a verified and reviewed generated-data PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/merge-data-pr.mjs
