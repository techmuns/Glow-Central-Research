name: Review generated data publication
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
concurrency:
  group: data-pr-review-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  gate:
    # ONLY EVENTS THAT CAN CHANGE THE ANSWER. Cloudflare edits its deploy comment on every build,
    # and each edit queued a run that cancelled the one waiting before it in this PR's concurrency
    # group; the `pull_request` Verify run GitHub creates for a bot-authored PR completes as
    # `action_required` and can never be the run that verified anything. Measured on 17 September
    # 2026: of 90 gate runs in one hour, most were cancelled while queued and the three that
    # completed were all for runs the script would only ever call unrelated.
    if: >-
      (github.event_name == 'issue_comment' && (github.event.comment.user.type != 'Bot' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Merge only a verified and reviewed generated-data PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/merge-data-pr.mjs
